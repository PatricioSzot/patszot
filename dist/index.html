<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6faff" />
    <title>Patrick Szot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wdth,wght@100,400&amp;display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="assets/ps-logo.png" width="908" height="200" alt="Patrick Szot" />

      <section class="profile" aria-label="Profile">
        <p class="bio"><span class="load-line" style="--i: 0">Brand Engineer</span><span class="load-line" style="--i: 1">Fulbright and Gilman Scholar</span></p>

        <div class="groups">
          <div class="group is-open">
            <button class="group-trigger load-line" style="--i: 2" type="button" aria-expanded="true" aria-controls="current-panel">
              <span>Currently: airops</span>
              <i class="ri-add-line" aria-hidden="true"></i>
            </button>
            <div class="group-panel" id="current-panel">
              <div class="group-panel-inner">
                <p class="load-line" style="--i: 3">Led 4-week brand transformation from this to<br />airops.com</p>
                <p class="load-line" style="--i: 4">Industry-specific image production</p>
                <p class="load-line" style="--i: 5">Brand strategy and web transformation</p>

                <div class="nested-group is-open">
                  <button class="nested-trigger load-line" style="--i: 6" type="button" aria-expanded="true" aria-controls="tooling-panel">
                    <span>Tooling and marketing org transformation</span>
                    <i class="ri-add-line" aria-hidden="true"></i>
                  </button>
                  <div class="nested-panel" id="tooling-panel">
                    <div class="nested-panel-inner">
                      <p><span class="load-line" style="--i: 7">Brand Portal</span><span class="load-line" style="--i: 8">Web Prototyping</span><span class="load-line" style="--i: 9">Old brand ,arketing asset maker</span></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="group previous">
            <button class="group-trigger load-line" style="--i: 10" type="button" aria-expanded="false" aria-controls="previous-panel">
              <span>Previously: <span class="muted">GlossAI 2024, Webflow 2020, Lovab...</span></span>
              <i class="ri-add-line" aria-hidden="true"></i>
            </button>
            <div class="group-panel" id="previous-panel" inert>
              <div class="group-panel-inner"></div>
            </div>
          </div>
        </div>
      </section>

      <p class="footer-contact load-line" style="--i: 11">patrick.m.szot@gmail.com</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
